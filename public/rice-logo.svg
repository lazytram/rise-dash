<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="riceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="innerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5F5DC;stop-opacity:1" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer circle with Bitcoin-inspired design -->
  <circle cx="100" cy="100" r="95" fill="url(#riceGradient)" stroke="#B8860B" stroke-width="3" filter="url(#glow)"/>

  <!-- Inner circle for rice grains -->
  <circle cx="100" cy="100" r="75" fill="url(#innerGradient)" stroke="#DAA520" stroke-width="2"/>

  <!-- Rice grains arranged in a circle pattern -->
  <!-- Top row -->
  <ellipse cx="85" cy="45" rx="8" ry="12" fill="#FFFFFF" stroke="#D3D3D3" stroke-width="1"/>
  <ellipse cx="115" cy="45" rx="8" ry="12" fill="#FFFFFF" stroke="#D3D3D3" stroke-width="1"/>

  <!-- Upper middle row -->
  <ellipse cx="70" cy="65" rx="6" ry="10" fill="#FFFFFF" stroke="#D3D3D3" stroke-width="1"/>
  <ellipse cx="100" cy="60" rx="7" ry="11" fill="#FFFFFF" stroke="#D3D3D3" stroke-width="1"/>
  <ellipse cx="130" cy="65" rx="6" ry="10" fill="#FFFFFF" stroke="#D3D3D3" stroke-width="1"/>

  <!-- Middle row -->
  <ellipse cx="60" cy="85" rx="5" ry="9" fill="#FFFFFF" stroke="#D3D3D3" stroke-width="1"/>
  <ellipse cx="85" cy="80" rx="6" ry="10" fill="#FFFFFF" stroke="#D3D3D3" stroke-width="1"/>
  <ellipse cx="115" cy="80" rx="6" ry="10" fill="#FFFFFF" stroke="#D3D3D3" stroke-width="1"/>
  <ellipse cx="140" cy="85" rx="5" ry="9" fill="#FFFFFF" stroke="#D3D3D3" stroke-width="1"/>

  <!-- Lower middle row -->
  <ellipse cx="70" cy="105" rx="6" ry="10" fill="#FFFFFF" stroke="#D3D3D3" stroke-width="1"/>
  <ellipse cx="100" cy="100" rx="7" ry="11" fill="#FFFFFF" stroke="#D3D3D3" stroke-width="1"/>
  <ellipse cx="130" cy="105" rx="6" ry="10" fill="#FFFFFF" stroke="#D3D3D3" stroke-width="1"/>

  <!-- Bottom row -->
  <ellipse cx="85" cy="125" rx="8" ry="12" fill="#FFFFFF" stroke="#D3D3D3" stroke-width="1"/>
  <ellipse cx="115" cy="125" rx="8" ry="12" fill="#FFFFFF" stroke="#D3D3D3" stroke-width="1"/>

  <!-- Center rice grain -->
  <ellipse cx="100" cy="100" rx="4" ry="6" fill="#FFD700" stroke="#DAA520" stroke-width="1"/>

  <!-- Bitcoin-style "R" letter in the center -->
  <text x="100" y="110" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#B8860B">R</text>

  <!-- Small decorative elements around the edge -->
  <circle cx="30" cy="100" r="3" fill="#FFD700" opacity="0.7"/>
  <circle cx="170" cy="100" r="3" fill="#FFD700" opacity="0.7"/>
  <circle cx="100" cy="30" r="3" fill="#FFD700" opacity="0.7"/>
  <circle cx="100" cy="170" r="3" fill="#FFD700" opacity="0.7"/>

  <!-- Corner accents -->
  <circle cx="40" cy="40" r="2" fill="#FFA500" opacity="0.8"/>
  <circle cx="160" cy="40" r="2" fill="#FFA500" opacity="0.8"/>
  <circle cx="40" cy="160" r="2" fill="#FFA500" opacity="0.8"/>
  <circle cx="160" cy="160" r="2" fill="#FFA500" opacity="0.8"/>
</svg>