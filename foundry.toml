[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 1000
depth = 15
fail_on_revert = false

# For testing with different solc versions
[profile.legacy]
solc_version = "0.8.19"

# For gas optimization
[profile.optimized]
optimizer = true
optimizer_runs = 10000
via_ir = true