name: Auto Delete Branch

on:
  pull_request:
    types: [closed]

jobs:
  delete-branch:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    permissions:
      contents: write

    steps:
      - name: Debug information
        uses: actions/github-script@v7
        with:
          script: |
            console.log('=== DEBUG INFO ===');
            console.log('Event type:', context.eventName);
            console.log('PR merged:', context.payload.pull_request.merged);
            console.log('Branch name:', context.payload.pull_request.head.ref);
            console.log('Is from fork:', context.payload.pull_request.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo);
            console.log('Repo owner:', context.repo.owner);
            console.log('Repo name:', context.repo.repo);
            console.log('==================');

      - name: Delete merged branch
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = context.payload.pull_request.head.ref;
            const isFromFork = context.payload.pull_request.head.repo.full_name !== context.repo.owner + '/' + context.repo.repo;

            // Don't delete branches from forks or protected branches
            const protectedBranches = ['main', 'master', 'develop', 'development', 'staging', 'production'];

            console.log(`Checking branch: ${branchName}`);
            console.log(`Is from fork: ${isFromFork}`);
            console.log(`Is protected: ${protectedBranches.includes(branchName)}`);

            if (isFromFork) {
              console.log('Branch is from a fork, skipping deletion');
              return;
            }

            if (protectedBranches.includes(branchName)) {
              console.log(`Branch ${branchName} is protected, skipping deletion`);
              return;
            }

            try {
              console.log(`Attempting to delete branch: ${branchName}`);
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branchName}`
              });
              console.log(`Successfully deleted branch: ${branchName}`);
            } catch (error) {
              console.log(`Failed to delete branch ${branchName}: ${error.message}`);
              console.log(`Error details:`, error);
              // Don't fail the workflow if branch deletion fails
            }
